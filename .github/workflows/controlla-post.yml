name: Controlla i post approvati
on:
  push:
    paths: ["post/**", "scripts/**"]
  pull_request:
    paths: ["post/**", "scripts/**"]
jobs:
  controlla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/controlla_post.py
